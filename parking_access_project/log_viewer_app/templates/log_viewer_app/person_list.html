<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title|default:"Lista de Personas" }}</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .container { max-width: 800px; margin: auto; }
        .action-links { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ page_title|default:"Lista de Personas" }}</h1>
        <div class="action-links">
            <a href="{% url 'log_viewer_app:person_create' %}">Añadir Nueva Persona</a>
            <br>
            <a href="{% url 'log_viewer_app:access_log_list' %}">Ver Registros de Acceso</a>
        </div>

        {% if persons %}
            <table>
                <thead>
                    <tr>
                        <th>Nombre Completo</th>
                        <th>Identificador</th>
                        <!--<th>Acciones</th>-->
                    </tr>
                </thead>
                <tbody>
                    {% for person in persons %}
                        <tr>
                            <td>{{ person.full_name }}</td>
                            <td>{{ person.identifier }}</td>
                            <!--<td><a href="#">Editar</a> | <a href="#">Eliminar</a></td>-->
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p>No hay personas registradas todavía.</p>
        {% endif %}
    </div>
</body>
</html>
